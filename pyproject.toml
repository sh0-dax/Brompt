[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brompt-engine"
version = "2.0.0"
description = "Deterministic State-Driven Engine for Advanced LLM Orchestration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40.0",
]
openai = [
    "openai>=1.50.0",
]
ollama = [
    "ollama>=0.3.0",
]
gemini = [
    "google-genai>=1.0.0",
]
mistral = [
    "mistralai>=1.0.0",
]
azure = [
    "openai>=1.50.0",
]
lmstudio = [
    "openai>=1.50.0",
]
all = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "ollama>=0.3.0",
    "google-genai>=1.0.0",
    "mistralai>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "streamlit>=1.35.0",
]
webui = [
    "streamlit>=1.35.0",
]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
]
redis = [
    "redis>=5.0.0",
]
feedback = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "ollama>=0.3.0",
    "google-genai>=1.0.0",
    "mistralai>=1.0.0",
]
routing = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "ollama>=0.3.0",
    "google-genai>=1.0.0",
    "mistralai>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "pyright>=1.1.350",
    "ruff>=0.1.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "ollama>=0.3.0",
    "google-genai>=1.0.0",
    "mistralai>=1.0.0",
    "redis>=5.0.0",
    "fakeredis[lua]>=2.20.0",
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[project.scripts]
brompt = "brompt.cli.main:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
disable_error_code = [
    "no-untyped-def",
    "type-arg",
    "no-untyped-call",
    "no-any-return",
    "var-annotated",
    "no-redef",
    "misc",
    "arg-type",
    "attr-defined",
    "return-value",
    "override",
    "comparison-overlap",
    "union-attr",
    "call-arg",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["venv", ".venv", "__pycache__", "src/brompt/guiapp"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "RUF"]
ignore = ["N802", "N803", "N806", "N815", "N816"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806", "N815", "N816", "N999", "RUF001"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingImports = false

[tool.coverage.run]
source = ["src/brompt"]
branch = true
omit = [
    "src/brompt/guiapp/*",
]

[tool.coverage.report]
fail_under = 50

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that make real API calls (excluded by default; run with -m integration)",
]
addopts = "-m 'not integration'"
