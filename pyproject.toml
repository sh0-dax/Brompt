[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brompt-engine"
version = "0.1.0-alpha"
description = "Deterministic State-Driven Engine for Advanced LLM Orchestration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40.0",
]
openai = [
    "openai>=1.50.0",
]
ollama = [
    "ollama>=0.3.0",
]
gemini = [
    "google-genai>=1.0.0",
]
mistral = [
    "mistralai>=1.0.0",
]
azure = [
    "openai>=1.50.0",
]
lmstudio = [
    "openai>=1.50.0",
]
all = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "ollama>=0.3.0",
    "google-genai>=1.0.0",
    "mistralai>=1.0.0",
]
redis = [
    "redis>=5.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "ollama>=0.3.0",
    "google-genai>=1.0.0",
    "mistralai>=1.0.0",
    "redis>=5.0.0",
    "fakeredis[lua]>=2.20.0",
]

[project.scripts]
brompt = "brompt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
